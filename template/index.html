<!DOCTYPE html>
<html lang="en">
<head>
  <title>__API_NAME__</title>
  <meta name="description" content="__API_DESCRIPTION__">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <link href="assets/bootstrap.min.css?__API_CACHE_BUSTING_QUERY_PARAM__" rel="stylesheet">
  <link href="assets/prism.css?__API_CACHE_BUSTING_QUERY_PARAM__" rel="stylesheet" />
  <link href="assets/prism-toolbar.css?__API_CACHE_BUSTING_QUERY_PARAM__" rel="stylesheet" />
  <link href="assets/prism-diff-highlight.css?__API_CACHE_BUSTING_QUERY_PARAM__" rel="stylesheet" />
  <link href="assets/main.css?__API_CACHE_BUSTING_QUERY_PARAM__" rel="stylesheet" media="screen, print">
  <link href="assets/favicon.ico?__API_CACHE_BUSTING_QUERY_PARAM__" rel="icon" type="image/x-icon">
  <link href="assets/apple-touch-icon.png?__API_CACHE_BUSTING_QUERY_PARAM__" rel="apple-touch-icon" sizes="180x180">
  <link href="assets/favicon-32x32.png?__API_CACHE_BUSTING_QUERY_PARAM__" rel="icon" type="image/png" sizes="32x32">
  <link href="assets/favicon-16x16.png?__API_CACHE_BUSTING_QUERY_PARAM__" rel="icon" type="image/png" sizes="16x16">
</head>

<body>

<!-- SIDENAV -->
<script id="template-sidenav" type="text/x-handlebars-template">
<div class="d-md-none">
  <div class="nav-toggle">
    <button type="button" class="btn btn-link" data-bs-toggle="offcanvas" data-bs-target="#sidebar" aria-controls="sidebar">
        <span class="visually-hidden">{{__ "Toggle navigation"}}</span>
        <span class="navbar-toggler-icon"></span>
    </button>
  </div>
</div>

<div class="offcanvas-md offcanvas-start" tabindex="-1" id="sidebar">

  <div class="offcanvas-body p-0">
    <nav id="scrollingNav" class="sidebar-offcanvas">
  <div class="sidenav-search">
    <input class="form-control search" data-action='filter-search' type="text" placeholder="{{__ "Filter..."}}" aria-label="{{__ "Filter..."}}">
    <button type="button" class="search-reset btn-close" aria-label="{{__ "Reset"}}"></button>
    <button type="button" class="btn-close-mobile d-md-none" data-bs-dismiss="offcanvas" data-bs-target="#sidebar" aria-label="Close">✕</button>
  </div>
  <ul class="sidenav nav flex-column list">
  {{#each nav}}
    {{#if title}}
      {{#if isHeader}}
        {{#if isFixed}}
          <li class="nav-fixed nav-header nav-list-item" data-group="{{group}}"><a href="#api-{{group}}" data-name="show-api-{{group}}" class="nav-link show-api api-{{group}}-init">{{underscoreToSpace title}}</a></li>
        {{else}}
          <li class="nav-header nav-list-item" data-group="{{group}}"><a href="#api-{{group}}" data-group="show-api-{{group}}" class="nav-link show-group api-{{group}}-init">{{underscoreToSpace title}}</a></li>
        {{/if}}
      {{else}}
        <li class="{{#if hidden}}d-none {{/if}}" data-group="{{group}}" data-name="{{name}}" data-version="{{version}}">
          <a href="#api-{{group}}-{{name}}" title="{{url}}" data-group="show-api-{{group}}" data-name="show-api-{{group}}-{{name}}" class="nav-link nav-list-item show-api api-{{group}}-{{name}}-init">{{title}}<div class="nav-list-url-item d-none">{{url}}</div></a>
        </li>
      {{/if}}
    {{/if}}
  {{/each}}
  </ul>
    </nav>
  </div>
</div>
</script>

<!-- PROJECT -->
<script id="template-project" type="text/x-handlebars-template">
  <div class="float-start">
    <h1>{{name}}</h1>
    {{#if description}}<h2>{{{nl2br description}}}</h2>{{/if}}
  </div>
  <div class="float-end">
    {{#if template.withCompare}}
    <div class="btn-group">
      <button id="version" class="btn btn-lg btn-outline-secondary dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
        <strong>{{version}}</strong>&nbsp;<span class="caret"></span>
      </button>
      <ul id="versions" class="dropdown-menu dropdown-menu-end">
        <li><a id="compareAllWithPredecessor" href="#" class="dropdown-item">{{__ "Compare all with predecessor"}}</a></li>
        <li><hr class="dropdown-divider"></li>
        <li><a href="#" class="dropdown-item disabled">{{__ "show up to version:"}}</a></li>
      {{#each versions}}
        <li class="version"><a href="#" class="dropdown-item">{{this}}</a></li>
      {{/each}}
      </ul>
    </div>
    {{else}}
    <div id="version" class="card card-body p-2">
      <strong>{{version}}</strong>
    </div>
    {{/if}}
  </div>
  <div class="clearfix"></div>
</script>

<script id="template-header" type="text/x-handlebars-template">
  {{#if content}}
    <div id="api-_header" class="show-api-article show-api-_-article mb-4">
      <div class="card">
        <div class="card-body">
          {{{content}}}
        </div>
      </div>
    </div>
  {{/if}}
</script>

<script id="template-footer" type="text/x-handlebars-template">
  {{#if content}}
    <div id="api-_footer" class="show-api-article show-api-_-article">{{{content}}}</div>
  {{/if}}
</script>

<script id="template-generator" type="text/x-handlebars-template">
  {{#if template.withGenerator}}
    {{#if generator}}
      <div>
        <p class="text-muted">
          {{__ "Generated with"}} <a href="{{{generator.url}}}">{{{generator.name}}}</a> {{{generator.version}}} - {{{generator.time}}}
        </p>
      </div>
    {{/if}}
  {{/if}}
</script>

<script id="template-sections" type="text/x-handlebars-template">
  <section id="api-{{group}}" class="show-api-group show-api-{{group}}-group {{#if aloneDisplay}} hide{{/if}}">
    <h1 class="color-primary fw-bold">{{underscoreToSpace title}}</h1>
    {{#if description}}
      <p>{{{nl2br description}}}</p>
    {{/if}}
    {{#each articles}}
      <div id="api-{{group}}-{{name}}" class="show-api-article show-api-{{group}}-article show-api-{{group}}-{{name}}-article {{#if aloneDisplay}} hide{{/if}}">
        {{{article}}}
      </div>
    {{/each}}
  </section>
</script>

<script id="template-article" type="text/x-handlebars-template">
  <article id="api-{{article.group}}-{{article.name}}-{{article.version}}" {{#if hidden}}class="hide"{{/if}} data-group="{{article.group}}" data-name="{{article.name}}" data-version="{{article.version}}">
    <div class="float-start">
      <h1><span class="color-primary">{{underscoreToSpace article.groupTitle}}</span>{{#if article.title}} <span class="text-muted">|</span> {{article.title}}{{/if}}</h1>
    </div>
    {{#if template.withCompare}}
    <div class="float-end">
      <div class="btn-group">
        <button class="version btn btn-outline-secondary dropdown-toggle" data-bs-toggle="dropdown">
          <strong>{{article.version}}</strong>
        </button>
        <ul class="versions dropdown-menu dropdown-menu-start">
          <li><span class="dropdown-item-text">{{__ "compare changes to:"}}</span></li>
        {{#each versions}}
          <li class="version"><a href="#" class="dropdown-item">{{this}}</a></li>
        {{/each}}
        </ul>
      </div>
    </div>
    {{/if}}
    <div class="clearfix"></div>

    {{#if article.author}}<h4 class="text-body-secondary">Authored by: {{article.author}}</h4>{{/if}}

    {{#if article.deprecated}}
      <p class="deprecated"><span>{{__ "DEPRECATED"}}</span>
        {{{markdown article.deprecated.content}}}
      </p>
    {{/if}}

    {{#if article.description}}
      <p>{{{nl2br article.description}}}</p>
    {{/if}}
    <span class="method meth-{{toLowerCase article.type}}">{{article.type}}</span>
    {{#if article.webhook}}<span class="method meth-webhook">Webhook</span>{{/if}}
    {{#if article.streaming}}<span class="method meth-stream">Stream · {{article.streaming.type}}</span>{{/if}}
    <pre 
      data-type="{{toLowerCase article.type}}"
      data-prismjs-copy="{{__ "Copy"}}"
      data-prismjs-copy-error="{{__ "Press Ctrl+C to copy"}}"
      data-prismjs-copy-success="{{__ "copied!"}}"
    ><code class="language-http">{{article.url}}</code></pre>
    {{#if article.webhook}}
      <p class="request-note">{{#ifCond article.webhook '===' true}}The API sends this request to the URL you register with it.{{else}}{{article.webhook}}{{/ifCond}}</p>
    {{/if}}
    {{#if article.streaming}}
      <p class="request-note">{{#if article.streaming.description}}{{article.streaming.description}}{{else}}The response is a stream ({{article.streaming.type}}): the connection stays open and the server sends events.{{/if}}</p>
    {{/if}}

    {{#if article.permission}}
      <p>
        {{__ "Permission:"}}
        {{#each article.permission}}
          {{name}}
          {{#if title}}
          <button type="button" class="btn btn-info btn-sm permission-info" aria-label="{{title}}" data-bs-title="{{title}}" data-bs-content="{{nl2br description}}" data-bs-html="true" data-bs-toggle="popover" data-bs-placement="right" data-bs-trigger="hover focus">
              <span aria-hidden="true">i</span>
          </button>
          {{/if}}
        {{/each}}
      </p>
    {{/if}}

    {{!-- CODE EXAMPLES IN TABS --}}
    {{#ifCond article.examples.length '>' 0}}
      <ul class="nav nav-tabs nav-tabs-examples" role="tablist">
        {{#each article.examples}}
          <li class="nav-item" role="presentation">
            <a class="nav-link{{#ifCond @index '==' 0}} active{{/ifCond}}" href="#examples-{{../id}}-{{@index}}" role="tab" data-bs-toggle="tab">{{#if title}}{{title}}{{else}}Example {{add @index 1}}{{/if}}</a>
          </li>
        {{/each}}
      </ul>

      <div class="tab-content">
      {{#each article.examples}}
        <div class="tab-pane fade{{#ifCond @index '==' 0}} show active{{/ifCond}}" id="examples-{{../id}}-{{@index}}">
          <div class="card mb-4">
            <div class="card-header">
              <strong>{{#if title}}{{title}}{{else}}Example {{add @index 1}}{{/if}}</strong>
            </div>
            <div class="card-body p-0">
              <pre 
                class="mb-0"
                data-type="{{type}}"
                data-prismjs-copy="{{__ "Copy"}}"
                data-prismjs-copy-error="{{__ "Press Ctrl+C to copy"}}"
                data-prismjs-copy-success="{{__ "copied!"}}"
              ><code class="language-{{type}}">{{content}}</code></pre>
            </div>
          </div>
        </div>
      {{/each}}
      </div>
    {{/ifCond}}

    {{subTemplate "article-param-block" params=article.header _hasType=_hasTypeInHeaderFields section="header"}}
    {{subTemplate "article-param-block" params=article.parameter _hasType=_hasTypeInParameterFields section="parameter"}}
    {{subTemplate "article-query-block" params=article.query _hasType=_hasTypeInParameterFields section="query"}}
    {{subTemplate "article-body-block" params=article.body _hasType=_hasTypeInParameterFields section="body"}}
    {{subTemplate "article-param-block" params=article.success _hasType=_hasTypeInSuccessFields section="success"}}
    {{subTemplate "article-param-block" params=article.responseHeader _hasType=true section="responseHeader"}}
    {{subTemplate "article-param-block" params=article.error _col1="Name" _hasType=_hasTypeInErrorFields section="error"}}

    {{#if (canTry article)}}{{subTemplate "article-sample-request" article=article id=id}}{{/if}}
  </article>
</script>

<script id="template-article-query-block" type="text/x-handlebars-template">
  {{#if article.query}}
    <h2>{{__ "Query Parameter(s)"}}</h2>
    <table>
      <thead>
        <tr>
          <th style="width: 30%">{{#if ../_col1}}{{__ ../_col1}}{{else}}{{__ "Field"}}{{/if}}</th>
          {{#unless this.Type compare=null}}
            <th style="width: 10%">{{__ "Type"}}</th>
          {{/unless}}
          <th style="width: {{#if ../_hasType}}60%{{else}}70%{{/if}}">{{__ "Description"}}</th>
        </tr>
      </thead>
      <tbody>
        {{#each params}}
          <tr>
            <td class="code">
            {{{nestObject this}}}
            {{#if this.optional}}
              <span class="label optional">{{__ "optional"}}</span>
            {{else}}
              {{#if ../template.showRequiredLabels}}
                <span class="label required">{{__ "required"}}</span>
              {{/if}}
            {{/if}}
            </td>
            {{#unless this.Type compare=null}}
              <td class="code">{{this.type}}</td>
            {{/unless}}
            <td>{{{nl2br this.description}}}
            {{#if defaultValue}}<p class="default-value">{{__ "Default value:"}} <code>{{{defaultValue}}}</code></p>{{/if}}
            {{#if size}}<p class="type-size">{{__ "Size range:"}} <code>{{{size}}}</code></p>{{/if}}
            {{#if allowedValues}}<p class="type-size">{{__ "Allowed values:"}}
              {{#each allowedValues}}
                <code>{{{this}}}</code>{{#unless @last}}, {{/unless}}
              {{/each}}
              </p>
            {{/if}}
            </td>
          </tr>
        {{/each}}
      </tbody>
    </table>
  {{/if}}
</script>

<script id="template-file-spec" type="text/x-handlebars-template">
  <div class="card file-spec mb-4">
    <div class="card-header file-spec-header">
      <strong class="code">{{name}}</strong>
      <span class="chip">{{#if formatLabel}}{{formatLabel}}{{else}}File{{/if}}{{#if multiple}} · several{{/if}}</span>
      {{#if size}}<span class="chip chip-muted">max {{size}}</span>{{/if}}
      {{#ifCond side '===' 'body'}}{{#if formats.length}}{{#if optional}}<span class="chip chip-muted">{{__ "optional"}}</span>{{else}}<span class="chip">{{__ "required"}}</span>{{/if}}{{/if}}{{/ifCond}}
    </div>
    <div class="card-body">
      <h4 class="file-spec-title">Expected columns</h4>
      <div class="table-responsive">
        <table class="file-columns">
          <thead>
            <tr>
              <th class="file-column-position">#</th>
              <th>Column</th>
              <th>{{__ "Type"}}</th>
              <th>Example</th>
              <th>{{__ "Description"}}</th>
            </tr>
          </thead>
          <tbody>
            {{#each columns}}
              <tr>
                <td class="file-column-position">{{position}}</td>
                <td class="code">{{name}} {{#if optional}}<span class="chip chip-muted">{{__ "optional"}}</span>{{/if}}</td>
                <td class="code">{{type}}</td>
                <td class="code">{{example}}</td>
                <td>
                  {{{description}}}
                  {{#if size}}<p class="type-size">{{__ "Size range:"}} <code>{{{size}}}</code></p>{{/if}}
                  {{#if allowedValues.length}}
                    <p class="type-size">{{__ "Allowed values:"}}
                      {{#each allowedValues}}<code>{{{this}}}</code>{{#unless @last}}, {{/unless}}{{/each}}
                    </p>
                  {{/if}}
                </td>
              </tr>
            {{/each}}
          </tbody>
        </table>
      </div>
      <h4 class="file-spec-title">Example file</h4>
      {{#if tabbed}}
        <ul class="nav nav-tabs nav-tabs-examples" role="tablist">
          {{#each tabs}}
            <li class="nav-item" role="presentation"><a class="nav-link{{#if @first}} active{{/if}}" href="#file-{{../id}}-{{../side}}{{../index}}-{{key}}" role="tab" data-bs-toggle="tab">{{title}}</a></li>
          {{/each}}
        </ul>
      {{/if}}
      <div class="tab-content">
        <div class="tab-pane fade show active" id="file-{{id}}-{{side}}{{index}}-sheet">
          <div class="file-sheet table-responsive">
            <table>
              <thead>
                <tr class="file-sheet-letters"><th></th>{{#each letters}}<th>{{this}}</th>{{/each}}</tr>
              </thead>
              <tbody>
                <tr class="file-sheet-header"><th class="file-sheet-row">1</th>{{#each header}}<td>{{this}}</td>{{/each}}</tr>
                {{#each rows}}
                  <tr><th class="file-sheet-row">{{add @index 2}}</th>{{#each this}}<td>{{this}}</td>{{/each}}</tr>
                {{/each}}
              </tbody>
            </table>
          </div>
        </div>
        {{#if text}}
          <div class="tab-pane fade" id="file-{{id}}-{{side}}{{index}}-text">
            <pre
              class="mb-0"
              data-type="text"
              data-prismjs-copy="{{__ "Copy"}}"
              data-prismjs-copy-error="{{__ "Press Ctrl+C to copy"}}"
              data-prismjs-copy-success="{{__ "copied!"}}"
            ><code class="language-none">{{text}}</code></pre>
          </div>
        {{/if}}
        {{#if response}}
          <div class="tab-pane fade" id="file-{{id}}-{{side}}{{index}}-response">
            <pre
              class="mb-0"
              data-type="http"
              data-prismjs-copy="{{__ "Copy"}}"
              data-prismjs-copy-error="{{__ "Press Ctrl+C to copy"}}"
              data-prismjs-copy-success="{{__ "copied!"}}"
            ><code class="language-http">{{response}}</code></pre>
          </div>
        {{/if}}
      </div>
    </div>
  </div>
</script>

<script id="template-article-body-block" type="text/x-handlebars-template">
  {{#if article.body}}
    <h2>{{#if article.webhook}}Payload{{else}}{{__ "Request Body"}}{{/if}}{{#if (hasNotableMime article)}} <span class="chip">{{bodyMime article}}</span>{{/if}}</h2>
    <table>
      <thead>
        <tr>
          <th style="width: 30%">{{#if ../_col1}}{{__ ../_col1}}{{else}}{{__ "Field"}}{{/if}}</th>
          {{#unless this.Type compare=null}}
            <th style="width: 10%">{{__ "Type"}}</th>
          {{/unless}}
          <th style="width: {{#if ../_hasType}}60%{{else}}70%{{/if}}">{{__ "Description"}}</th>
        </tr>
      </thead>
      <tbody>
        {{#each params}}
          <tr>
            <td class="code">
            {{{nestObject this}}}
            {{#if this.optional}}
              <span class="label optional">{{__ "optional"}}</span>
            {{else}}
              {{#if ../template.showRequiredLabels}}
                <span class="label required">{{__ "required"}}</span>
              {{/if}}
            {{/if}}
            </td>
            {{#unless this.Type compare=null}}
              <td class="code">{{this.type}}</td>
            {{/unless}}
            <td>
              {{{nl2br this.description}}}
              {{#if defaultValue}}
                <p class="default-value">{{__ "Default value:"}} <code>{{{defaultValue}}}</code></p>
              {{/if}}
              {{#if size}}
                <p class="type-size">{{#if (isFileType type)}}Size limit:{{else}}{{__ "Size range:"}}{{/if}} <code>{{{size}}}</code></p>
              {{/if}}
              {{#if allowedValues}}
                <p class="type-size">{{#if (isFileType type)}}Accepted formats:{{else}}{{__ "Allowed values:"}}{{/if}}
                  {{#each allowedValues}}
                    <code>{{#if (isFileType ../type)}}{{removeDblQuotes this}}{{else}}{{{this}}}{{/if}}</code>{{#unless @last}}, {{/unless}}
                  {{/each}}
                </p>
              {{/if}}
            </td>
          </tr>
        {{/each}}
      </tbody>
    </table>
    {{#each (fileSpecs article 'body')}}
      {{subTemplate "file-spec" id=../id index=@index}}
    {{/each}}
    {{#if (requestExample article)}}
      <ul class="nav nav-tabs nav-tabs-examples" role="tablist">
        {{#each (requestExample article)}}
          <li class="nav-item" role="presentation"><a class="nav-link{{#ifCond @index '==' 0}} active{{/ifCond}}" href="#request-{{../id}}-{{key}}" role="tab" data-bs-toggle="tab">{{title}}</a></li>
        {{/each}}
      </ul>
      <div class="tab-content">
        {{#each (requestExample article)}}
          <div class="tab-pane fade{{#ifCond @index '==' 0}} show active{{/ifCond}}" id="request-{{../id}}-{{key}}">
            <div class="card mb-4">
              <div class="card-header"><strong>Example request</strong></div>
              <div class="card-body p-0">
                <pre
                  class="mb-0"
                  data-type="{{language}}"
                  data-prismjs-copy="{{__ "Copy"}}"
                  data-prismjs-copy-error="{{__ "Press Ctrl+C to copy"}}"
                  data-prismjs-copy-success="{{__ "copied!"}}"
                ><code class="language-{{language}}">{{code}}</code></pre>
              </div>
            </div>
          </div>
        {{/each}}
      </div>
    {{else}}{{#if (isJsonKind article)}}{{#unless (hasJsonExample article.parameter.examples)}}
      <div class="card mb-4">
        <div class="card-header">
          <strong>Example</strong>
        </div>
        <div class="card-body p-0">
          <pre
            class="mb-0"
            data-type="json"
            data-body-fields="{{bodyFieldLabels article.body}}"
            data-body-generated
            data-prismjs-copy="{{__ "Copy"}}"
            data-prismjs-copy-error="{{__ "Press Ctrl+C to copy"}}"
            data-prismjs-copy-success="{{__ "copied!"}}"
          ><code class="language-json">{{body2json article.body}}</code></pre>
        </div>
      </div>
    {{/unless}}{{/if}}{{/if}}
  {{/if}}
</script>

<script id="template-article-param-block" type="text/x-handlebars-template">
  {{#if params}}
    {{#each params.fields}}
      <h2>{{__ @key}}</h2>
      <table>
        <thead>
          <tr>
          <th style="width: 30%">{{#if ../_col1}}{{__ ../_col1}}{{else}}{{__ "Field"}}{{/if}}</th>
            {{#if ../_hasType}}<th style="width: 10%">{{__ "Type"}}</th>{{/if}}
            <th style="width: {{#if ../_hasType}}60%{{else}}70%{{/if}}">{{__ "Description"}}</th>
          </tr>
        </thead>
        <tbody>
        {{#each this}}
          <tr>
            <td class="code">
            {{{nestObject this}}}
            {{#if optional}}
              <span class="label optional">{{__ "optional"}}</span>
            {{else}}
              {{#if ../../template.showRequiredLabels}}
                <span class="label required">{{__ "required"}}</span>
              {{/if}}
            {{/if}}</td>
            {{#if ../../_hasType}}
              <td class="code">
                {{{type}}}
              </td>
            {{/if}}
            <td>
            {{{nl2br description}}}
            {{#if defaultValue}}<p class="default-value">{{__ "Default value:"}} <code>{{{defaultValue}}}</code></p>{{/if}}
            {{#if size}}<p class="type-size">{{__ "Size range:"}} <code>{{{size}}}</code></p>{{/if}}
            {{#if allowedValues}}<p class="type-size">{{__ "Allowed values:"}}
              {{#each allowedValues}}
                <code>{{{this}}}</code>{{#unless @last}}, {{/unless}}
              {{/each}}
              </p>
            {{/if}}
            </td>
          </tr>
        {{/each}}
        </tbody>
      </table>
    {{/each}}
    {{#ifCond section '===' 'success'}}
      {{#each (fileSpecs article 'response')}}
        {{subTemplate "file-spec" id=../id index=@index}}
      {{/each}}
    {{/ifCond}}
    {{#ifCond params.examples.length '>' 0}}
      <ul class="nav nav-tabs nav-tabs-examples" role="tablist">
      {{#each params.examples}}
        <li class="nav-item" role="presentation">
          <a class="nav-link{{#ifCond @index '==' 0}} active{{/ifCond}}" href="#{{../section}}-examples-{{../id}}-{{@index}}" role="tab" data-bs-toggle="tab">{{#if title}}{{title}}{{else}}Example {{add @index 1}}{{/if}}</a>
        </li>
      {{/each}}
      </ul>

      <div class="tab-content">
      {{#each params.examples}}
        <div class="tab-pane fade{{#ifCond @index '==' 0}} show active{{/ifCond}}" id="{{../section}}-examples-{{../id}}-{{@index}}">
          <div class="card mb-4">
            <div class="card-header">
              <strong>{{#if title}}{{title}}{{else}}Example {{add @index 1}}{{/if}}</strong>
            </div>
            <div class="card-body p-0">
              <pre 
                class="mb-0"
                data-type="{{type}}"
                {{#ifCond ../section '==' 'parameter'}}{{#if ../article.body}}data-body-fields="{{bodyFieldLabels ../article.body}}"{{/if}}{{/ifCond}}
                data-prismjs-copy="{{__ "Copy"}}"

                    placeholder="{{#if defaultValue}}{{ defaultValue }}{{/if}}"

                    data-family="query"
                    data-group="{{@../index}}"
                    {{#if optional}}data-optional="true"{{/if}}>

                  {{/if}}

          {{/each}}
        {{/if}}

      {{#if article.query}}

                <div class="input-group-text">{{{type}}}</div>
                {{#if (hasChoices this)}}

                  <select class="form-control" data-name="{{dot2bracket this}}" data-family="query" data-group="{{@../index}}" {{#if optional}}data-optional="true"{{/if}}>
                    <option value="" class="empty">&lt;{{__ "No value"}}&gt;</option>
                    {{#each allowedValues}}
                    <option {{#ifCond ../defaultValue '===' this}} selected {{/ifCond}}value="{{{removeDblQuotes this}}}">{{{removeDblQuotes this}}}</option>
                    {{/each}}
                  </select>
                </div>
                <input class="invisible">
                {{else}}

                    value="{{#if defaultValue}}{{ defaultValue }}{{/if}}"
                    placeholder="{{#if defaultValue}}{{ defaultValue }}{{/if}}"

                    data-group="{{@../index}}"

              <option value="body-json" selected>json</option>

            {{/ifCond}}
          </select>
        </div>

        <div id="sample-request-body-json-input-{{this.id}}"{{#unless (isTextBody article)}} style="display: none"{{/unless}}>

            spellcheck="false" autocomplete="off"
            {{#ifCond (bodyKind article) '===' 'json'}}data-autocomplete="{{bodyAutocompleteFields article.body}}"{{/ifCond}}
            aria-label="{{bodyMime article}}"
            data-family="body-json"
            data-name="body"
            data-mime="{{bodyMime article}}"
            data-content-type="json"
            {{#if optional}}data-optional="true"{{/if}}>{{#ifCond (bodyKind article) '===' 'json'}}{{body2json article.body}}{{else}}{{article.parameter.examples.0.content}}{{/ifCond}}</textarea>
          {{#ifCond (bodyKind article) '===' 'json'}}<div class="form-text">Type <code>"</code> or press Ctrl+Space for field suggestions.</div>{{/ifCond}}

        <div{{#unless (isFormBody article)}} style="display: none"{{/unless}} data-body-encoding="{{#ifCond (bodyKind article) '===' 'urlencoded'}}urlencoded{{else}}multipart{{/ifCond}}" id="sample-request-body-form-input-{{this.id}}">

              {{#ifNotObject type}}

              <label class="form-label" for="{{@root.id}}-sample-request-param-field-{{field}}">{{unquoteField field}}{{#if optional}} <small class="text-muted">(optional)</small>{{/if}}</label>
              <div class="input-group">
                <div class="input-group-text">{{{type}}}</div>
                {{#if (hasChoices this)}}

                  <select class="form-control" data-name="{{dot2bracket this}}" data-family="body" data-group="{{@../index}}" {{#if optional}}data-optional="true"{{/if}}>

                    {{#each allowedValues}}
                    <option {{#ifCond ../defaultValue '===' this}} selected {{/ifCond}}value="{{{removeDblQuotes this}}}">{{{removeDblQuotes this}}}</option>
                    {{/each}}
                  </select>
                </div>
                <input class="invisible">
                {{else}}

                  type="{{setInputType type}}"
                  {{#ifCond type '===' 'File[]'}}multiple{{/ifCond}}
                  value="{{#ifCond type '!==' 'Boolean'}}{{#if defaultValue}}{{ defaultValue }}{{/if}}{{/ifCond}}"
                  {{#if checked}}checked{{/if}}
                  placeholder="{{#if defaultValue}}{{ defaultValue }}{{/if}}"
                  data-family="body"
                  data-name="{{dot2bracket this}}"
                  data-content-type="form"
                  {{#if optional}}data-optional="true"{{/if}}>

                {{/if}}
              </div>
              </div>
              {{/ifNotObject}}
          {{/each}}
        </div>
      {{/if}}

          <div class="sample-request-actions controls">
            <button class="btn btn-primary sample-request-send" data-type="{{article.type}}">{{__ "Send"}}</button>
            <button class="btn btn-outline-secondary sample-request-clear" data-type="{{article.type}}">{{__ "Reset"}}</button>
          </div>
          <div class="sample-request-response" hidden>
            <div class="sample-request-section-head">
              <h4 class="sample-request-section">{{__ "Response"}}</h4>
              <button class="btn btn-outline-secondary btn-sm sample-request-clear">X</button>
            </div>
            <div class="card">
              <div class="card-body p-0">
                <pre 
                  class="m-0 p-3"
                  data-type="json"

            </div>
          </div>
        </fieldset>
      </form>
    </div>
    </div>
  {{/if}}
</script>

<script id="template-compare-article" type="text/x-handlebars-template">
  <article id="api-{{article.group}}-{{article.name}}-{{article.version}}" {{#if hidden}}class="hide"{{/if}} data-group="{{article.group}}" data-name="{{article.name}}" data-version="{{article.version}}" data-compare-version="{{compare.version}}">
    <div class="float-start">
      <h1>{{underscoreToSpace article.groupTitle}} | {{{showDiff article.title compare.title}}}</h1>
    </div>

    <div class="float-end">
      <div class="btn-group">
        <button class="btn btn-success" disabled>
          <strong>{{article.version}}</strong> {{__ "compared to"}}
        </button>
        <button class="version btn btn-danger dropdown-toggle" data-bs-toggle="dropdown">
          <strong>{{compare.version}}</strong>
        </button>
        <ul class="versions dropdown-menu dropdown-menu-start">
          <li><span class="dropdown-item-text">{{__ "compare changes to:"}}</span></li>
          <li><hr class="dropdown-divider"></li>
        {{#each versions}}
          <li class="version"><a href="#" class="dropdown-item">{{this}}</a></li>
        {{/each}}
        </ul>
      </div>
    </div>
    <div class="clearfix"></div>

    {{#if article.description}}
      <p>{{{showDiff article.description compare.description "nl2br"}}}</p>
    {{else}}
      {{#if compare.description}}
      <p>{{{showDiff "" compare.description "nl2br"}}}</p>
      {{/if}}
    {{/if}}

    <span class="method meth-{{toLowerCase compare.type}}">{{compare.type}}</span>
    <pre 
      data-type="{{toLowerCase article.type}}" 
      data-prismjs-copy="{{__ "Copy"}}"
      data-prismjs-copy-error="{{__ "Press Ctrl+C to copy"}}"
      data-prismjs-copy-success="{{__ "copied!"}}"
      class="language-html"
    >{{{showDiff article.url compare.url}}}</pre>

    {{subTemplate "article-compare-permission" article=article compare=compare}}

    <ul class="nav nav-tabs nav-tabs-examples" role="tablist">
    {{#each_compare_title article.examples compare.examples}}
      {{#if typeSame}}
        <li class="nav-item" role="presentation">
          <a class="nav-link{{#ifCond index '==' 0}} active{{/ifCond}}" href="#compare-examples-{{../article.id}}-{{index}}" role="tab" data-bs-toggle="tab">{{#if source.title}}{{{showDiff source.title compare.title}}}{{else}}Example {{add index 1}}{{/if}}</a>
        </li>
      {{/if}}

      {{#if typeIns}}
        <li class="nav-item" role="presentation">
          <a class="nav-link{{#ifCond index '==' 0}} active{{/ifCond}}" href="#compare-examples-{{../article.id}}-{{index}}" role="tab" data-bs-toggle="tab"><ins>{{#if source.title}}{{{source.title}}}{{else}}Example {{add index 1}}{{/if}}</ins></a>
        </li>
      {{/if}}

      {{#if typeDel}}
        <li class="nav-item" role="presentation">
          <a class="nav-link{{#ifCond index '==' 0}} active{{/ifCond}}" href="#compare-examples-{{../article.id}}-{{index}}" role="tab" data-bs-toggle="tab"><del>{{#if compare.title}}{{{compare.title}}}{{else}}Example {{add index 1}}{{/if}}</del></a>
        </li>
      {{/if}}
    {{/each_compare_title}}
    </ul>

    <div class="tab-content">
    {{#each_compare_title article.examples compare.examples}}

      {{#if typeSame}}
        <div class="tab-pane fade{{#ifCond index '==' 0}} show active{{/ifCond}}" id="compare-examples-{{../article.id}}-{{index}}">
          <pre 
            data-type="{{source.type}}"
            data-prismjs-copy="{{__ "Copy"}}"
            data-prismjs-copy-error="{{__ "Press Ctrl+C to copy"}}"
            data-prismjs-copy-success="{{__ "copied!"}}"
          ><code class="language-diff-{{source.type}} diff-highlight">{{{showDiff source.content compare.content "code"}}}</code></pre>
        </div>
      {{/if}}

      {{#if typeIns}}
        <div class="tab-pane fade{{#ifCond index '==' 0}} show active{{/ifCond}}" id="compare-examples-{{../article.id}}-{{index}}">
          <pre 
            data-type="{{source.type}}"
            data-prismjs-copy="{{__ "Copy"}}"
            data-prismjs-copy-error="{{__ "Press Ctrl+C to copy"}}"
            data-prismjs-copy-success="{{__ "copied!"}}"
          ><code class="language-{{source.type}}">{{{source.content}}}</code></pre>
        </div>
      {{/if}}

      {{#if typeDel}}
        <div class="tab-pane fade{{#ifCond index '==' 0}} show active{{/ifCond}}" id="compare-examples-{{../article.id}}-{{index}}">
          <pre 
            data-type="{{compare.type}}"
            data-prismjs-copy="{{__ "Copy"}}"
            data-prismjs-copy-error="{{__ "Press Ctrl+C to copy"}}"
            data-prismjs-copy-success="{{__ "copied!"}}"
          ><code class="language-{{source.type}}">{{{compare.content}}}</code></pre>
        </div>
      {{/if}}

    {{/each_compare_title}}
    </div>

    {{subTemplate "article-compare-param-block" source=article.header compare=compare.header _hasType=_hasTypeInHeaderFields section="header"}}
    {{subTemplate "article-compare-param-block" source=article.parameter compare=compare.parameter _hasType=_hasTypeInParameterFields section="parameter"}}
    {{subTemplate "article-compare-query-block" source=article.query compare=compare.query _hasType=_hasTypeInParameterFields section="query"}} 
    {{subTemplate "article-compare-body-block" source=article.body compare=compare.body _hasType=_hasTypeInParameterFields section="body"}} 
    {{subTemplate "article-compare-param-block" source=article.success compare=compare.success _hasType=_hasTypeInSuccessFields section="success"}}
    {{subTemplate "article-compare-param-block" source=article.error compare=compare.error _col1="Name" _hasType=_hasTypeInErrorFields section="error"}}

    {{#if (canTry article)}}{{subTemplate "article-sample-request" article=article id=id}}{{/if}}

  </article>
</script>

    </ul>

    <div class="tab-content">
    {{#each_compare_title source.examples compare.examples}}

      {{#if typeSame}}
        <div class="tab-pane fade{{#ifCond index '==' 0}} show active{{/ifCond}}" id="{{../section}}-compare-examples-{{../article.id}}-{{index}}">
          <pre 
            data-type="{{source.type}}"
            data-prismjs-copy="{{__ "Copy"}}"
            data-prismjs-copy-error="{{__ "Press Ctrl+C to copy"}}"
            data-prismjs-copy-success="{{__ "copied!"}}"
          ><code class="language-diff-{{source.type}} diff-highlight">{{{showDiff source.content compare.content "code"}}}</code></pre>
        </div>
      {{/if}}

      {{#if typeIns}}
        <div class="tab-pane fade{{#ifCond index '==' 0}} show active{{/ifCond}}" id="{{../section}}-compare-examples-{{../article.id}}-{{index}}">
          <pre 
            data-type="{{source.type}}"
            data-prismjs-copy="{{__ "Copy"}}"
            data-prismjs-copy-error="{{__ "Press Ctrl+C to copy"}}"
            data-prismjs-copy-success="{{__ "copied!"}}"
          ><code class="language-{{source.type}}">{{{source.content}}}</code></pre>
        </div>
      {{/if}}

      {{#if typeDel}}
        <div class="tab-pane fade{{#ifCond index '==' 0}} show active{{/ifCond}}" id="{{../section}}-compare-examples-{{../article.id}}-{{index}}">
          <pre 
            data-type="{{compare.type}}"
            data-prismjs-copy="{{__ "Copy"}}"
            data-prismjs-copy-error="{{__ "Press Ctrl+C to copy"}}"
            data-prismjs-copy-success="{{__ "copied!"}}"
          ><code class="language-{{source.type}}">{{{compare.content}}}</code></pre>
        </div>
      {{/if}}
    {{/each_compare_title}}
    </div>
    {{/if}}
  {{/if}}
</script>

<script id="template-article-compare-query-block" type="text/x-handlebars-template">
  {{#if article.query}}
    <h2>{{__ "Query Parameter(s)"}}</h2>
    <table class="table table-hover">
      <thead>
        <tr>
          <th style="width: 30%">{{#if ../_col1}}{{__ ../_col1}}{{else}}{{__ "Field"}}{{/if}}</th>
          {{#unless this.Type compare=null}}
            <th style="width: 10%">{{__ "Type"}}</th>
          {{/unless}}
          <th style="width: {{#if ../_hasType}}60%{{else}}70%{{/if}}">{{__ "Description"}}</th>
        </tr>
      </thead>
      {{subTemplate "article-compare-param-block-body" source=source compare=compare _hasType=this.type}}
    </table>
  {{/if}}
</script>

<script id="template-article-compare-body-block" type="text/x-handlebars-template">
  {{#if article.body}}
    <h2>{{__ "Request Body"}}</h2>
    <table class="table table-hover">
      <thead>
        <tr>
          <th style="width: 30%">{{#if ../_col1}}{{__ ../_col1}}{{else}}{{__ "Field"}}{{/if}}</th>
          {{#unless this.Type compare=null}}
            <th style="width: 10%">{{__ "Type"}}</th>
          {{/unless}}
          <th style="width: {{#if ../_hasType}}60%{{else}}70%{{/if}}">{{__ "Description"}}</th>
        </tr>
      </thead>
      {{subTemplate "article-compare-param-block-body" source=source compare=compare _hasType=this.type}}
    </table>
  {{/if}}
</script>

<script id="template-article-compare-param-block-body" type="text/x-handlebars-template">
  <tbody>
    {{#each_compare_field source compare}}
      {{#if typeSame}}
        <tr>
          <td class="code">
            {{{nestObject source}}}
            {{#if source.optional}}
              {{#if compare.optional}} <span class="label label-optional">{{__ "optional"}}</span>
              {{else}} <span class="label label-optional label-ins">{{__ "optional"}}</span>
              {{/if}}
            {{else}}
              {{#if compare.optional}} <span class="label label-optional label-del">{{__ "optional"}}</span>{{/if}}
            {{/if}}
          </td>

        {{#if source.type}}
          {{#if compare.type}}
          <td>{{{showDiff source.type compare.type}}}</td>
          {{else}}
          <td>{{{source.type}}}</td>
          {{/if}}
        {{else}}
          {{#if compare.type}}
          <td>{{{compare.type}}}</td>
          {{else}}
            {{#if ../../../../_hasType}}<td></td>{{/if}}
          {{/if}}
        {{/if}}
          <td>
            {{{showDiff source.description compare.description "nl2br"}}}
            {{#if source.defaultValue}}<p class="default-value">{{__ "Default value:"}} <code>{{{showDiff source.defaultValue compare.defaultValue}}}</code></p>{{/if}}
          </td>
        </tr>
      {{/if}}

      {{#if typeIns}}
        <tr class="ins">
          <td class="code">
            {{{nestObject source}}}
            {{#if source.optional}} <span class="label label-optional label-ins">{{__ "optional"}}</span>{{/if}}
          </td>

        {{#if source.type}}
          <td>{{{source.type}}}</td>
        {{else}}
          {{{typRowTd}}}
        {{/if}}

          <td>
            {{{nl2br source.description}}}
            {{#if source.defaultValue}}<p class="default-value">{{__ "Default value:"}} <code>{{{source.defaultValue}}}</code></p>{{/if}}
          </td>
        </tr>
      {{/if}}

      {{#if typeDel}}
        <tr class="del">
          <td class="code">
            {{{nestObject compare}}}
            {{#if compare.optional}} <span class="label label-optional label-del">{{__ "optional"}}</span>{{/if}}
          </td>

        {{#if compare.type}}
          <td>{{{compare.type}}}</td>
        {{else}}
          {{{typRowTd}}}
        {{/if}}

          <td>
            {{{nl2br compare.description}}}
            {{#if compare.defaultValue}}<p class="default-value">{{__ "Default value:"}} <code>{{{compare.defaultValue}}}</code></p>{{/if}}
          </td>
        </tr>
      {{/if}}

    {{/each_compare_field}}
  </tbody>
</script>
